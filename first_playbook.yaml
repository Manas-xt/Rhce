---
- name: first play
  hosts: all
  tasks: 
        - name: create a group
          group:
                name: devops
                state: present 
        - name: create a user
          user: 
               name: dev
               group: devops
               state: present
        - name: copy rcat.txt
          copy: 
               src: /home/admin/ansible/rcat.txt
               dest: /         
               state: present

- name: second play 
  hosts: worker1
  tasks: 
        - name : added a line in file
          lineinfile:
                     path: /rcat.txt
                     line: whatsup buddy!  
